[build]
  command = "npm run build"
  publish = ".output/public"
  environment = { NITRO_PRESET = "netlify" }

[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
